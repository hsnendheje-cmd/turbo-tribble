<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QSTAR</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(160deg, #a855f7 0%, #7c3aed 35%, #4c1d95 70%, #1e0a3c 100%);
    background-attachment: fixed;
    color: #f3eaff;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- Header ---------- */
  header {
    text-align: center;
    padding: 90px 20px 50px;
  }

  h1.title {
    font-size: clamp(3.5rem, 10vw, 6.5rem);
    font-weight: 800;
    letter-spacing: 0.25em;
    margin-right: -0.25em;
    color: #ffffff;
    text-shadow: 0 0 50px rgba(216, 180, 254, 0.4);
    animation: fadeDown 0.9s ease both;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .divider {
    width: 140px;
    height: 3px;
    margin: 26px auto 0;
    border: none;
    border-radius: 999px;
    background: linear-gradient(90deg, transparent, #e9d5ff, transparent);
    animation: fadeIn 1s ease 0.3s both;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* ---------- Tabs ---------- */
  .tabs {
    display: inline-flex;
    gap: 6px;
    margin-top: 34px;
    padding: 6px;
    border-radius: 999px;
    background: rgba(30, 10, 60, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.12);
    animation: fadeIn 1s ease 0.45s both;
  }

  .tab-btn {
    font-family: inherit;
    font-size: 0.88rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: rgba(243, 234, 255, 0.75);
    background: transparent;
    border: none;
    padding: 12px 30px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease;
  }

  .tab-btn:hover { color: #ffffff; }

  .tab-btn.active {
    color: #1e0a3c;
    background: linear-gradient(90deg, #e9d5ff, #c084fc);
  }

  .tab-panel { display: none; }

  .tab-panel.active {
    display: block;
    animation: panelIn 0.4s ease both;
  }

  @keyframes panelIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ---------- Main layout ---------- */
  main {
    max-width: 1100px;
    margin: 0 auto;
    padding: 40px 40px 0;
  }

  .section-left {
    max-width: 380px;
  }

  .section-label {
    font-size: 0.85rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    color: #d8b4fe;
    margin-bottom: 16px;
  }

  /* ---------- Cards ---------- */
  .card, .friend-card {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    box-shadow: 0 8px 32px rgba(30, 10, 60, 0.4);
    transition: transform 0.25s ease, border-color 0.25s ease;
  }

  .card:hover, .friend-card:hover {
    transform: translateY(-4px);
    border-color: rgba(233, 213, 255, 0.4);
  }

  .card { padding: 26px 28px; }

  .card .badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: #1e0a3c;
    background: #d8b4fe;
    padding: 5px 12px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .card h2 {
    font-size: 1.4rem;
    font-weight: 700;
    margin-bottom: 10px;
    color: #ffffff;
  }

  .card p {
    font-size: 0.95rem;
    line-height: 1.6;
    color: rgba(243, 234, 255, 0.8);
  }

  .card-btn {
    display: inline-block;
    margin-top: 20px;
    padding: 12px 26px;
    font-size: 0.9rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    text-decoration: none;
    color: #1e0a3c;
    background: linear-gradient(90deg, #e9d5ff, #c084fc);
    border-radius: 999px;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .card-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(192, 132, 252, 0.4);
  }

  /* ---------- Friends ---------- */
  

  /* ---------- Bottom skills section ---------- */
  .skills {
    margin-top: 55vh;
    padding: 80px 20px 100px;
    text-align: center;
  }

  .skills h2 {
    font-size: clamp(1.5rem, 4vw, 2.2rem);
    font-weight: 700;
    color: #ffffff;
  }

  .skills .tags {
    margin-top: 22px;
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
  }

  .skills .tag {
    padding: 10px 22px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 0.95rem;
    color: #f3eaff;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.18);
  }

  .reveal {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }

  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  @media (max-width: 600px) {
    main { padding: 24px 24px 0; }
    .section-left { max-width: 100%; }
  }
</style>
</head>
<body>

  <header>
    <h1 class="title">QSTAR</h1>
    <hr class="divider">
    <nav class="tabs">
      <button class="tab-btn active" data-tab="main">Main Menu</button>
    </nav>
  </header>

  <main>
    <div id="tab-main" class="tab-panel active">
      <section class="section-left">
        <div class="section-label">Currently working on</div>

        <div class="card">
          <span class="badge">Released</span>
          <h2>RYKER'S PAID MENU</h2>
          <p>yea</p>
          <a class="card-btn" href="https://discord.gg/ryker" target="_blank" rel="noopener">Join the Discord</a>
        </div>
      </section>
    </div>

    <div id="tab-friends" class="tab-panel">
      <div class="section-label">Friends</div>
      <div class="friends-grid">
        <div class="friend-card">
          <div class="avatar">R</div>
          <h3>Ryker</h3>
        </div>
        <div class="friend-card">
          <div class="avatar">C</div>
          <h3>CatsTheCoder</h3>
        </div>
        <div class="friend-card">
          <div class="avatar">E</div>
          <h3>Eljay</h3>
        </div>
      </div>
    </div>
  </main>

  <section class="skills reveal">
    <h2>idfk</h2>
    <div class="tags">
      <span class="tag">JavaScript</span>
      <span class="tag">TypeScript</span>
    </div>
  </section>

  <script>
    document.querySelectorAll('.tab-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach((b) => b.classList.remove('active'));
        document.querySelectorAll('.tab-panel').forEach((p) => p.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
      });
    });

    const observer = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          entry.target.classList.add('visible');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold: 0.2 });
    document.querySelectorAll('.reveal').forEach((el) => observer.observe(el));
  </script>

</body>
</html>
